[build-system]
# License expressions need setuptools 77
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "astro-vinua"
version = "0.1.0"
description = "Astrophotography tools: forecast, focus, center, capture, stack, plate-solve, and chart, with a web app"
readme = "README.md"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "astroalign",
    "astropy>=7.0,<9",
    "astroquery>=0.4.10,<1",
    "dateparser>=1.2,<2",
    "exifread",
    "matplotlib>=3.8,<4",
    "numpy>=1.24",
    "rawpy",
    "requests",
    "scipy>=1.10",
]

[project.scripts]
astro = "astro.__main__:main"

[tool.setuptools.packages.find]
include = ["astro", "astro.*"]

[tool.setuptools.package-data]
astro = ["web/*.html"]
